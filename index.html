<!DOCTYPE HTML>
<HTML>
    <HEAD>
        <TITLE>개인용ai 노트</TITLE>
         <style>
        /* 🖤 전체 기본 화면 기본 세팅 */
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 🌈 메인 화면용 정중앙 정렬 방 (메모장 열리기 전) */
        .main-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 56px; 
            background: linear-gradient(to right, #4285f4, #9b51e0, #ea4335, #fbbc05, #4285f4);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-flow 2s linear infinite;
        }

        @keyframes rainbow-flow {
            0% { background-position: 0% center; }
            100% { background-position: -200% center; }
        }
        
        button {
            padding: 10px 20px;
            background-color: #2997ff;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        /* 🗺️ 메모장이 열렸을 때 작동하는 좌/우 분할 레이아웃 컨트롤러 */
        .memo-layout-workspace {
            display: none; 
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
        }

        /* 👈 [사이드바 구역] 뒤로가기 버튼과 기능 버튼들이 사는 왼쪽 구석 공간 */
        .left-sidebar {
            width: 80px;                
            height: 100vh;
            padding: 20px 0 0 20px;     
            display: flex;
            flex-direction: column;
            gap: 15px;                  
            box-sizing: border-box;
            float: left;                
        }

        /* 🔙 뒤로가기 버튼 */
        #back-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            background-color: #1c1c1e;
            color: #2997ff;
            font-size: 16px;
            border: 1px solid #2997ff;
            border-radius: 8px;
            cursor: pointer;
        }
        #back-btn:hover {
            background-color: #2997ff;
            color: #ffffff;
        }

        /* 🎙️ 남색 감성의 이쁜 사각형 모양 음성 인식 버튼 */
        #speech-btn {
            width: 50px;                
            height: 40px;
            padding: 0;
            font-size: 14px;
            background-color: #0a192f;  
            color: #38bdf8;             
            border: 1px solid #38bdf8;  
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15); 
        }
        #speech-btn:hover {
            background-color: #38bdf8;  
            color: #000000;
        }

        /* 🔊 [스위치 연동 스타일 수정을 반영] 켜짐/꺼짐에 따라 색상이 실시간으로 변하는 오디오 스위치 버튼 */
        #speak-btn {
            width: 50px;                
            height: 40px;
            padding: 0;
            font-size: 14px;
            background-color: #0a192f;  
            color: #a855f7;             
            border: 1px solid #a855f7;  
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.15); 
            cursor: pointer;
        }

        /* 👉 [메모장 구역] 거대한 우측 공간 단독 배정 */
        .right-content {
            margin-left: 80px;          
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 📥 우측 구역을 자석처럼 꽉 채우는 대형 메모 상자 */
        textarea {
            width: 100%;
            height: calc(100vh - 40px); 
            background-color: #1c1c1e;
            color: #ffffff;
            font-size: 18px;
            padding: 25px;
            border: 2px solid #2997ff;
            border-radius: 16px;
            outline: none;
            resize: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            box-sizing: border-box;
        }
    </style>
    </HEAD>
<body>

    <!-- 1층 무대: 초기 정중앙 화면 -->
    <div id="main-view" class="main-container">
        <h1 id="title">안녕하세요</h1>
        <button id="memo-btn" onclick="openmemo()">메모창 열기</button>
    </div>

    <!-- 2층 무대: 메모장 전용 분할 작업 공간 -->
    <div id="workspace-view" class="memo-layout-workspace">
        <div class="left-sidebar">
            <button id="back-btn" onclick="closememo()">◀</button>
            <button id="speech-btn" onclick="startSpeech()">🎙️</button> 
            <!-- 🔊 스피커 ON / OFF 토글 연동 버튼 -->
            <button id="speak-btn" onclick="toggleAudioSwitch()">🔊 켜짐</button> 
        </div>
        <div class="right-content">
            <textarea id="memo-box" oninput="savememo()"></textarea>        
        </div>
    </div>

</body>

    <script>
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    var recognition = new SpeechRecognition();

    recognition.lang = 'ko-KR'; 
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    var isListening = false;
    
    // 💡 [유저 기획 필수 변수] 스피커가 켜져 있는지 꺼져 있는지 기억하는 안전장치 스위치 (기본값: 켜짐)
    var isAudioOn = true; 

    recognition.onresult = function(event) {
        var speechResult = event.results[0][0].transcript; 
        var memoBox = document.getElementById('memo-box');
        
        var summarizedText = speechResult
            .replace(/말이야|했거든|진짜로|그니까|진짜|약간/g, "")
            .trim();
            
        if (summarizedText.length > 0) {
            var fullNewText = "\n요약: " + summarizedText;
            
            // 🚀 1. 오디오 스위치가 '켜짐' 상태일 때만 실시간 목소리 출력 작동
            if (isAudioOn) {
                window.speechSynthesis.cancel(); // 꼬임 방지 초기화
                var utterance = new SpeechSynthesisUtterance(summarizedText); // 요약 내용만 읽기 지정
                utterance.lang = 'ko-KR';
                utterance.rate = 1.2; // 글씨 써지는 속도에 맞춰 살짝 빠르게 배속 튜닝
                window.speechSynthesis.speak(utterance);
            }
            
            // 🚀 2. [타자기 연출 장치] 한 번에 띡 적지 않고 한 글자씩 빠르게 따다닥 채워나가는 무대 기술
            var charIndex = 0;
            function typeWriter() {
                if (charIndex < fullNewText.length) {
                    memoBox.value += fullNewText.charAt(charIndex);
                    charIndex++;
                    savememo(); // 한 글자씩 써질 때마다 영구 저장 장치 연동
                    setTimeout(typeWriter, 50); // 0.05초 간격으로 타자기 치듯 글자 촤르륵 연출
                }
            }
            typeWriter(); // 타자기 가동!
        }
    };

    recognition.onend = function() {
        isListening = false;
        document.getElementById('speech-btn').innerText = "🎙️";
        document.getElementById('speech-btn').style.backgroundColor = "#0a192f";
    };

    function startSpeech() {
        if (isListening) {
            recognition.stop();
        } else {
            try {
                window.speechSynthesis.cancel(); 
                recognition.start();
                isListening = true;
                document.getElementById('speech-btn').innerText = "🎧";
                document.getElementById('speech-btn').style.backgroundColor = "#ea4335"; 
            } catch(e) {
                recognition.stop();
            }
        }
    }

    // 🔊 [오디오 마스터 제어 스위치 함수] 버튼을 누를 때마다 켜고 끄는 토글 제어 장치
    function toggleAudioSwitch() {
        var speakBtn = document.getElementById('speak-btn');
        if (isAudioOn) {
            // 스피커 끄기 모드 돌입
            isAudioOn = false;
            window.speechSynthesis.cancel(); // 읽고 있던 소리 강제 묵념
            speakBtn.innerText = "🔇 꺼짐";
            speakBtn.style.color = "#86868b"; // 꺼졌을 땐 비활성화 느낌의 회색 컬러
            speakBtn.style.border = "1px solid #86868b";
            speakBtn.style.boxShadow = "none";
        } else {
            // 스피커 켜기 모드 돌입
            isAudioOn = true;
            speakBtn.innerText = "🔊 켜짐";
            speakBtn.style.color = "#a855f7"; // 켜졌을 땐 시그니처 보라색 컬러 부활
            speakBtn.style.border = "1px solid #a855f7";
            speakBtn.style.boxShadow = "0 4px 15px rgba(168, 85, 247, 0.15)";
        }
    }

    window.onload = function() {
        var savedText = localStorage.getItem('mySecretMemo');
        if (savedText) {
            document.getElementById('memo-box').value = savedText;
        }
    }

    function savememo() {
        var boxValue = document.getElementById('memo-box').value;
        localStorage.setItem('mySecretMemo', boxValue);
    }

    function openmemo() {
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('workspace-view').style.display = 'block';
    }

    function closememo() {
        window.speechSynthesis.cancel(); 
        document.getElementById('workspace-view').style.display = 'none';
        document.getElementById('main-view').style.display = 'flex';
        try { recognition.stop(); } catch(e) {}
    }
    </script>
</HTML>
