<!DOCTYPE HTML>
<HTML>
<HEAD>
    <TITLE>개인용ai 노트</TITLE>
    <style>
        /* 🖤 전체 기본 화면 세팅 */
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        /* 🌈 메인 화면용 정중앙 정렬 방 */
        .main-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 56px;
            background: linear-gradient(to right, #4285f4, #9b51e0, #ea4335, #fbbc05, #4285f4);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-flow 2s linear infinite;
        }

        @keyframes rainbow-flow {
            0% { background-position: 0% center; }
            100% { background-position: -200% center; }
        }
        
        button {
            padding: 10px 20px;
            background-color: #2997ff;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        /* 🗺️ 좌/우 분할 레이아웃 컨트롤러 */
        .memo-layout-workspace {
            display: none;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
        }

        /* 👈 [사이드바 구역] */
        .left-sidebar {
            width: 80px;
            height: 100vh;
            padding: 20px 0 0 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
            float: left;
            align-items: center;
        }

        /* 🔙 뒤로가기 버튼 */
        #back-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            background-color: #1c1c1e;
            color: #2997ff;
            font-size: 16px;
            border: 1px solid #2997ff;
            border-radius: 8px;
            cursor: pointer;
        }
        #back-btn:hover {
            background-color: #2997ff;
            color: #ffffff;
        }

        /* 🎙️ 음성 인식 버튼 */
        #speech-btn {
            width: 50px;
            height: 40px;
            padding: 0;
            font-size: 14px;
            background-color: #0a192f;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15);
        }
        #speech-btn:hover {
            background-color: #38bdf8;
            color: #000000;
        }

        /* 🔊 스피커 토글 버튼 */
        #speak-btn {
            width: 50px;
            height: 40px;
            padding: 0;
            font-size: 14px;
            background-color: #0a192f;
            color: #a855f7;
            border: 1px solid #a855f7;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.15);
            cursor: pointer;
        }

        /* 🎵 구글 검색 스타일의 말할 때 춤추는 점 4개 컨테이너 */
        .google-dots-container {
            display: none;
            gap: 4px;
            justify-content: center;
            align-items: center;
            height: 30px;
            width: 50px;
            margin-top: 5px;
        }
        .google-dots-container.active {
            display: flex;
        }

        /* 동글동글한 점 공통 스타일 및 통통 튀는 구글 애니메이션 */
        .google-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: google-bounce 1s infinite ease-in-out;
        }
        .google-dot:nth-child(1) { background-color: #4285f4; animation-delay: 0.0s; }
        .google-dot:nth-child(2) { background-color: #ea4335; animation-delay: 0.15s; }
        .google-dot:nth-child(3) { background-color: #fbbc05; animation-delay: 0.3s; }
        .google-dot:nth-child(4) { background-color: #34a853; animation-delay: 0.45s; }

        @keyframes google-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
                /* 👉 [메모장 구역] */
        .right-content {
            margin-left: 80px;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        textarea {
            width: 100%;
            height: calc(100vh - 40px);
            background-color: #1c1c1e;
            color: #ffffff;
            font-size: 18px;
            padding: 25px;
            border: 2px solid #2997ff;
            border-radius: 16px;
            outline: none;
            resize: none;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }
    </style>
</HEAD>
<BODY>
    <!-- 1층 무대: 초기 정중앙 화면 -->
    <div id="main-view" class="main-container">
        <h1>안녕하세요</h1>
        <button id="memo-btn" onclick="openmemo()">메모창 열기</button>
    </div>

    <!-- 2층 무대: 메모장 전용 분할 작업 공간 -->
    <div id="workspace-view" class="memo-layout-workspace">
        <div class="left-sidebar">
            <button id="back-btn" onclick="closememo()">◀</button>
            <button id="speech-btn" onclick="startSpeech()">🎙️</button>
            <button id="speak-btn" onclick="toggleAudioSwitch()">🔊 켜짐</button>
            
            <!-- 🎵 🔊 버튼 밑에 고정 배치된 점 4개 구조 -->
            <div id="google-dots" class="google-dots-container">
                <div class="google-dot"></div>
                <div class="google-dot"></div>
                <div class="google-dot"></div>
                <div class="google-dot"></div>
            </div>
        </div>
        <div class="right-content">
            <textarea id="memo-box" oninput="savememo()"></textarea>
        </div>
    </div>

    <script>
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        var recognition = new SpeechRecognition();
        recognition.lang = 'ko-KR';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        var isListening = false;
        var isAudioOn = true;

        recognition.onresult = function(event) {
            // 🎯 원래 가지고 계셨던 완벽한 정석 배열 방 번호 문법으로 완전 복구!
            var speechResult = event.results[0][0].transcript;
            var memoBox = document.getElementById('memo-box');
            var summarizedText = speechResult.replace(/말이야|했거든|진짜로|그니까|진짜|약간/g, "").trim();
            
            if (summarizedText.length > 0) {
                var fullNewText = "\n요약: " + summarizedText;
                if (isAudioOn) {
                    window.speechSynthesis.cancel();
                    var utterance = new SpeechSynthesisUtterance(summarizedText);
                    utterance.lang = 'ko-KR';
                    utterance.rate = 1.1;
                    window.speechSynthesis.speak(utterance);
                }
                var charIndex = 0;
                function typeWriter() {
                    if (charIndex < fullNewText.length) {
                        memoBox.value += fullNewText.charAt(charIndex);
                        charIndex++;
                        savememo();
                        setTimeout(typeWriter, 50);
                    }
                }
                typeWriter();
            }
        };

        recognition.onend = function() {
            isListening = false;
            document.getElementById('speech-btn').innerText = "🎙️";
            document.getElementById('speech-btn').style.backgroundColor = "#0a192f";
            document.getElementById('google-dots').classList.remove('active');
        };

        function startSpeech() {
            if (isListening) {
                recognition.stop();
            } else {
                try {
                    window.speechSynthesis.cancel();
                    recognition.start();
                    isListening = true;
                    document.getElementById('speech-btn').innerText = "🎧";
                    document.getElementById('speech-btn').style.backgroundColor = "#ea4335";
                    document.getElementById('google-dots').classList.add('active');
                } catch(e) {
                    recognition.stop();
                }
            }
        }

        function toggleAudioSwitch() {
            var speakBtn = document.getElementById('speak-btn');
            if (isAudioOn) {
                isAudioOn = false;
                window.speechSynthesis.cancel();
                speakBtn.innerText = "🔇 꺼짐";
                speakBtn.style.color = "#86868b";
                speakBtn.style.border = "1px solid #86868b";
                speakBtn.style.boxShadow = "none";
            } else {
                isAudioOn = true;
                speakBtn.innerText = "🔊 켜짐";
                speakBtn.style.color = "#a855f7";
                speakBtn.style.border = "1px solid #a855f7";
                speakBtn.style.boxShadow = "0 4px 15px rgba(168, 85, 247, 0.15)";
            }
        }

        window.onload = function() {
            var savedText = localStorage.getItem('mySecretMemo');
            if (savedText) {
                document.getElementById('memo-box').value = savedText;
            }
        }

        function savememo() {
            var boxValue = document.getElementById('memo-box').value;
            localStorage.setItem('mySecretMemo', boxValue);
        }

        function openmemo() {
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('workspace-view').style.display = 'block';
        }

        function closememo() {
            window.speechSynthesis.cancel();
            document.getElementById('workspace-view').style.display = 'none';
            document.getElementById('main-view').style.display = 'flex';
            try { recognition.stop(); } catch(e) {}
            document.getElementById('google-dots').classList.remove('active');
        }
    </script>
</BODY>
</HTML>
