<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다시 시도하는 내 2번째 사이트</title>
    <style>
        /* 기본 스타일 리셋 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #f5f5f7;
        }

        /* 상단 네비게이션 바 */
        .nav-bar {
            width: 100%;
            height: 44px;
            background-color: rgba(22, 22, 23, 0.8);
            backdrop-filter: blur(20px);
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .nav-container {
            width: 100%;
            max-width: 1024px;
            display: flex;
            justify-content: space-around;
            padding: 0 22px;
        }

        .nav-item {
            color: #cccccc;
            font-size: 12px;
            text-decoration: none;
            opacity: 0.8;
            cursor: pointer;
        }

        .nav-item:hover {
            opacity: 1;
        }

        /* 메인 히어로 섹션 */
        .hero-section {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: center;
            padding-top: 140px;
            background-color: #000000;
        }

        .hero-title {
            font-size: 56px;
            font-weight: 600;
            letter-spacing: -0.005em;
            margin-bottom: 6px;
        }

        .hero-subtitle {
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 0.004em;
            margin-bottom: 18px;
        }

        /* 링크 버튼 스타일 */
        .cta-links {
            display: flex;
            gap: 20px;
        }

        .cta-link {
            font-size: 21px;
            color: #2997ff;
            text-decoration: none;
            cursor: pointer;
        }

        .cta-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 상단 메뉴바 -->
    <nav class="nav-bar">
        <div class="nav-container">
            <span class="nav-item">0</span>
            <span class="nav-item">1</span>
            <span class="nav-item">2</span>
            <span class="nav-item">3</span>
            <span class="nav-item">4</span>
            <span class="nav-item">5</span>
        </div>
    </nav>

    <!-- 메인 화면 콘텐츠 -->
    <main class="hero-section">
        <h1 class="hero-title">다시 재시도 합니다</h1>
        <h2 class="hero-subtitle">알아서 잘.</h2>
        <div class="cta-links">
            <a class="cta-link" href="#">흠..</a>
            <a class="cta-link" href="#">해보자</a>
        </div>
    </main>

</body>
</html>
