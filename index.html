<!DOCTYPE HTML>
<HTML>
    <HEAD>
        <TITLE>개인용ai 노트</TITLE>
         <style>
        /* 🖤 전체 화면 배경 및 세로 정중앙 정렬 */
        body {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            flex-direction: column;
            
            /* 🚀 [오직 이 한 줄만 추가] 피처폰 글씨체를 부드러운 요즘 앱 글씨체로 싹 변경 */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 🌈 게이밍 RGB 스타일 무지개 글씨 효과 (2초 회전) */
        h1 {
            font-size: 56px; 
            background: linear-gradient(to right, #4285f4, #9b51e0, #ea4335, #fbbc05, #4285f4);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-flow 2s linear infinite;
        }

        @keyframes rainbow-flow {
            0% { background-position: 0% center; }
            100% { background-position: -200% center; }
        }
        
        /* 💙 메인 [메모창 열기] 파란색 버튼 디자인 */
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2997ff;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        /* 🔙 왼쪽 상단 작고 예쁜 사각형 뒤로가기 버튼 디자인 */
        #back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            margin-top: 0;
            width: 40px;
            height: 40px;
            padding: 0;
            background-color: #1c1c1e;
            color: #2997ff;
            font-size: 16px;
            border: 1px solid #2997ff;
            border-radius: 8px;
            cursor: pointer;
        }
        #back-btn:hover {
            background-color: #2997ff;
            color: #ffffff;
        }

        /* 🎙️ 음성 요약 버튼 디자인 */
        #speech-btn {
            background-color: #ea4335;
            margin-top: 15px;
            font-weight: bold;
        }

        /* 📥 글을 쓸 수 있는 네모난 메모장 디자인 */
        textarea {
            margin-top: 30px;
            width: 100%;
            max-width: 450px;
            height: 250px;
            background-color: #1c1c1e;
            color: #ffffff;
            font-size: 18px;
            padding: 20px;
            border: 2px solid #2997ff;
            border-radius: 16px;
            outline: none;
            resize: none;
            
            /* 🚀 메모장 내부 적히는 텍스트도 똑같이 부드러운 글씨체 적용 */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
    </HEAD>
<body>
    <h1 id="title">안녕하세요</h1>
    <button id="memo-btn" onclick="openmemo()">메모창 열기</button>
    <textarea id="memo-box" style="display: none;" oninput="savememo()"></textarea>        
    <button id="back-btn" onclick="closememo()" style="display: none;">◀</button>
    <button id="speech-btn" onclick="startSpeech()" style="display: none;">🎙️ 음성 요약 시작</button>
</body>

    <script>
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    var recognition = new SpeechRecognition();

    recognition.lang = 'ko-KR';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    var isListening = false;

    recognition.onresult = function(event) {
        var speechResult = event.results[0][0].transcript; 
        var memoBox = document.getElementById('memo-box');
        
        var summarizedText = speechResult
            .replace(/말이야|했거든|진짜로|그니까|진짜|약간/g, "")
            .trim();
            
        if (summarizedText.length > 0) {
            memoBox.value = memoBox.value + "\n📌 요약: " + summarizedText;
            savememo();
        }
    };

    recognition.onend = function() {
        isListening = false;
        document.getElementById('speech-btn').innerText = "🎙️ 음성 요약 시작";
    };

    function startSpeech() {
        if (isListening) {
            recognition.stop();
        } else {
            try {
                recognition.start();
                isListening = true;
                document.getElementById('speech-btn').innerText = "🎧 핵심 요약 듣는 중...";
            } catch(e) {
                recognition.stop();
            }
        }
    }

    window.onload = function() {
        var savedText = localStorage.getItem('mySecretMemo');
        if (savedText) {
            document.getElementById('memo-box').value = savedText;
        }
    }

    function savememo() {
        var boxValue = document.getElementById('memo-box').value;
        localStorage.setItem('mySecretMemo', boxValue);
    }

    function openmemo() {
        document.getElementById('title').style.display = 'none';
        document.getElementById('memo-btn').style.display = 'none';
        document.getElementById('memo-box').style.display = 'block';
        document.getElementById('back-btn').style.display = 'block';
        document.getElementById('speech-btn').style.display = 'block'; 
    }

    function closememo() {
        document.getElementById('title').style.display = 'block';   
        document.getElementById('memo-btn').style.display = 'block';     
        document.getElementById('memo-box').style.display = 'none';      
        document.getElementById('back-btn').style.display = 'none';  
        document.getElementById('speech-btn').style.display = 'none'; 
        try { recognition.stop(); } catch(e) {}
    }
    </script>
</HTML>
