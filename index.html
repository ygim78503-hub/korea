<!DOCTYPE HTML>
<HTML>
    <HEAD>
        <TITLE>개인용ai 노트</TITLE>
         <style>
        /* 🖤 전체 기본 화면 기본 세팅 */
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 🌈 메인 화면용 정중앙 정렬 방 (메모장 열리기 전) */
        .main-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 56px; 
            background: linear-gradient(to right, #4285f4, #9b51e0, #ea4335, #fbbc05, #4285f4);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-flow 2s linear infinite;
        }

        @keyframes rainbow-flow {
            0% { background-position: 0% center; }
            100% { background-position: -200% center; }
        }
        
        button {
            padding: 10px 20px;
            background-color: #2997ff;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        /* 🗺️ [핵심 추가] 메모장이 열렸을 때 작동하는 좌/우 분할 레이아웃 컨트롤러 */
        .memo-layout-workspace {
            display: none; /* 평소엔 숨김 */
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
        }

        /* 👈 [사이드바 구역] 뒤로가기 버튼과 음성인식 버튼이 사는 왼쪽 구석 공간 */
        .left-sidebar {
            width: 80px;                /* 왼쪽 버튼 구역 너비 고정 */
            height: 100vh;
            padding: 20px 0 0 20px;     /* 위쪽과 왼쪽에 적절한 여백 배치 */
            display: flex;
            flex-direction: column;
            gap: 15px;                  /* ◀ 버튼과 음성인식 버튼 사이의 간격 */
            box-sizing: border-box;
            float: left;                /* 왼쪽에 강제 박제 */
        }

        /* 🔙 뒤로가기 버튼 (위치 고정을 고치고 사이드바 안으로 정렬) */
        #back-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            background-color: #1c1c1e;
            color: #2997ff;
            font-size: 16px;
            border: 1px solid #2997ff;
            border-radius: 8px;
            cursor: pointer;
        }
        #back-btn:hover {
            background-color: #2997ff;
            color: #ffffff;
        }

        /* 🎙️ [위치 재조정] 유저님 설계도의 노랑 칸 자리로 들어간 남색 음성 인식 버튼 */
        #speech-btn {
            width: 50px;                /* 작고 이쁜 모양새의 크기 지정 */
            height: 40px;
            padding: 0;
            font-size: 14px;
            background-color: #0a192f;  
            color: #38bdf8;             
            border: 1px solid #38bdf8;  
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15); 
        }
        #speech-btn:hover {
            background-color: #38bdf8;  
            color: #000000;
        }

        /* 👉 [메모장 구역] 설계도상의 거대한 우측 빨간 칸 영역 */
        .right-content {
            margin-left: 80px;          /* 왼쪽 사이드바 너비만큼 침범 방지 */
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 📥 우측 구역을 자석처럼 꽉 채우는 대형 메모 상자 */
        textarea {
            width: 100%;
            height: calc(100vh - 40px); /* 화면 전체 높이에서 여백 빼고 꽉 채우기 */
            background-color: #1c1c1e;
            color: #ffffff;
            font-size: 18px;
            padding: 25px;
            border: 2px solid #2997ff;
            border-radius: 16px;
            outline: none;
            resize: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            box-sizing: border-box;
        }
    </style>
    </HEAD>
<body>

    <!-- 1층 무대: 초기 정중앙 화면 -->
    <div id="main-view" class="main-container">
        <h1 id="title">안녕하세요</h1>
        <button id="memo-btn" onclick="openmemo()">메모창 열기</button>
    </div>

    <!-- 2층 무대: [설계도 연동] 메모장 전용 분할 작업 공간 -->
    <div id="workspace-view" class="memo-layout-workspace">
        
        <!-- 👈 왼쪽 구역 (뒤로가기 + 음성인식 배치) -->
        <div class="left-sidebar">
            <button id="back-btn" onclick="closememo()">◀</button>
            <button id="speech-btn" onclick="startSpeech()">🎙️</button> <!-- 작고 이쁜 사각형에 맞춰 🎙️ 아이콘만 깔끔하게 축소 -->
        </div>
        
        <!-- 👉 오른쪽 구역 (거대 메모장 단독 배치) -->
        <div class="right-content">
            <textarea id="memo-box" oninput="savememo()"></textarea>        
        </div>
        
    </div>

</body>

    <script>
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    var recognition = new SpeechRecognition();

    recognition.lang = 'ko-KR';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    var isListening = false;

    recognition.onresult = function(event) {
        var speechResult = event.results.transcript; 
        var memoBox = document.getElementById('memo-box');
        
        var summarizedText = speechResult
            .replace(/말이야|했거든|진짜로|그니까|진짜|약간/g, "")
            .trim();
            
        if (summarizedText.length > 0) {
            memoBox.value = memoBox.value + "\n📌 요약: " + summarizedText;
            savememo();
        }
    };

    recognition.onend = function() {
        isListening = false;
        document.getElementById('speech-btn').innerText = "🎙️";
        document.getElementById('speech-btn').style.backgroundColor = "#0a192f";
    };

    function startSpeech() {
        if (isListening) {
            recognition.stop();
        } else {
            try {
                recognition.start();
                isListening = true;
                document.getElementById('speech-btn').innerText = "🎧";
                document.getElementById('speech-btn').style.backgroundColor = "#ea4335"; // 인식 중일 땐 알아채기 쉽게 빨간 불빛 효과
            } catch(e) {
                recognition.stop();
            }
        }
    }

    window.onload = function() {
        var savedText = localStorage.getItem('mySecretMemo');
        if (savedText) {
            document.getElementById('memo-box').value = savedText;
        }
    }

    function savememo() {
        var boxValue = document.getElementById('memo-box').value;
        localStorage.setItem('mySecretMemo', boxValue);
    }

    function openmemo() {
        // 메인 정중앙 뷰 숨기기
        document.getElementById('main-view').style.display = 'none';
        // 설계도대로 조각된 전체 분할 워크스페이스 켜기
        document.getElementById('workspace-view').style.display = 'block';
    }

    function closememo() {
        // 분할 워크스페이스 숨기기
        document.getElementById('workspace-view').style.display = 'none';
        // 초기 화면 정중앙 뷰 다시 켜기
        document.getElementById('main-view').style.display = 'flex';
        try { recognition.stop(); } catch(e) {}
    }
    </script>
</HTML>
