<!DOCTYPE HTML>
<HTML>
    <HEAD>
        <TITLE> 개인용ai 노트</TITLE>
         <style>
        body {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            /* 글자 크기를 딱 보기 좋은 애플 사이즈(56px)로 고정합니다 */
            font-size: 56px; 
            
            /* 무지개 배경을 가로로 길게 늘려 배치합니다 */
            background: linear-gradient(to right, #4285f4, #9b51e0, #ea4335, #fbbc05, #4285f4);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* 🚀 [오타 수정] 4s(4초) 동안 무한히(infinite) 부드럽게 흐르게 만듭니다 */
            animation: rainbow-flow 2s linear infinite;
        }

        /* 🎬 무지개 배경을 왼쪽에서 오른쪽으로 무한히 밀어주는 규칙 */
        @keyframes rainbow-flow {
            0% { background-position: 0% center; }
            100% { background-position: -200% center; }
        }
    </style>
    </HEAD>
<body>
    <h1>안녕하세요</h1>
</body>
</HTML>
