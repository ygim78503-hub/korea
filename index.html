<!DOCTYPE HTML>
<HTML>
    <HEAD>
        <TITLE> 개인용ai 노트</TITLE>
         <style>
        body {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            flex-direction: column; /* 🚀 버튼이 아랫줄에 이쁘게 나오도록 추가해 두었습니다! */
        }

        h1 {
            font-size: 56px; 
            background: linear-gradient(to right, #4285f4, #9b51e0, #ea4335, #fbbc05, #4285f4);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-flow 2s linear infinite;
        }

        @keyframes rainbow-flow {
            0% { background-position: 0% center; }
            100% { background-position: -200% center; }
        }
        
        button {
            margin-top:20px;
            padding: 10px 20px;
            background-color: #2997ff;
            color: white;
            font-size: 18px;
            border: none;
            border-radius:20px;
            cursor: pointer;
        }
    </style>
    </HEAD>
<body>
    <h1 id="title">안녕하세요</h1> <!-- 🚀 1. t 하나 빼고 title 명찰로 완벽하게 수정! -->
    <button id="memo-btn" onclick="openmemo()">메모창 열기</button> <!-- 🚀 2. 끝에 button 오타 수정! -->
    <textarea id="memo-box" style="display: none; width: 300px; height: 150px; font-size: 16px; padding: 10px;"></textarea>        
</body>
    <script>
    function openmemo() {
        var title = document.getElementById('title');
        var btn = document.getElementById('memo-btn');
        var box = document.getElementById('memo-box');
        
        title.style.display = 'none';
        btn.style.display = 'none';
        box.style.display = 'block';
    }
    </script>
</HTML>
