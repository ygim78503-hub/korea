<!DOCTYPE HTML>
<HTML>
    <HEAD>
        <TITLE>개인용ai 노트</TITLE>
         <style>
        body {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            flex-direction: column;
        }

        h1 {
            font-size: 56px; 
            background: linear-gradient(to right, #4285f4, #9b51e0, #ea4335, #fbbc05, #4285f4);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-flow 2s linear infinite;
        }

        @keyframes rainbow-flow {
            0% { background-position: 0% center; }
            100% { background-position: -200% center; }
        }
        
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2997ff;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        #back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            margin-top: 0;
            width: 40px;
            height: 40px;
            padding: 0;
            background-color: #1c1c1e;
            color: #2997ff;
            font-size: 16px;
            border: 1px solid #2997ff;
            border-radius: 8px;
            cursor: pointer;
        }
        #back-btn:hover {
            background-color: #2997ff;
            color: #ffffff;
        }

        #speech-btn {
            background-color: #ea4335;
            margin-top: 15px;
            font-weight: bold;
        }

        textarea {
            margin-top: 30px;
            width: 100%;
            max-width: 450px;
            height: 250px;
            background-color: #1c1c1e;
            color: #ffffff;
            font-size: 18px;
            padding: 20px;
            border: 2px solid #2997ff;
            border-radius: 16px;
            outline: none;
            resize: none;
        }
    </style>
    </HEAD>
<body>
    <h1 id="title">안녕하세요</h1>
    <button id="memo-btn" onclick="openmemo()">메모창 열기</button>
    <textarea id="memo-box" style="display: none;" oninput="savememo()"></textarea>        
    <button id="back-btn" onclick="closememo()" style="display: none;">◀</button>
    <button id="speech-btn" onclick="startSpeech()" style="display: none;">🎙️ 음성 요약 시작</button>
</body>

    <script>
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    var recognition = new SpeechRecognition();

    recognition.lang = 'ko-KR';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    // 💡 음성 인식이 완전히 완전히 끝났을 때 안전하게 리셋해 주는 장치
    var isListening = false;

    recognition.onresult = function(event) {
        var speechResult = event.results[0][0].transcript; // 🚀 안전하게 첫 번째 변환 텍스트 가져오기
        var memoBox = document.getElementById('memo-box');
        
        var summarizedText = speechResult
            .replace(/말이야|했거든|진짜로|그니까|진짜|약간/g, "")
            .trim();
            
        if (summarizedText.length > 0) {
            memoBox.value = memoBox.value + "\n📌 요약: " + summarizedText;
            savememo();
        }
    };

    // 💡 [핵심 수정] 마이크가 꺼지면 상태를 '완전 종료'로 바꾸고 버튼 글자 리셋
    recognition.onend = function() {
        isListening = false;
        document.getElementById('speech-btn').innerText = "🎙️ 음성 요약 시작";
    };

    // 🎙️ 마이크 버튼 토글 기능 (켜져 있으면 끄고, 꺼져 있으면 켜기)
    function startSpeech() {
        if (isListening) {
            recognition.stop();
        } else {
            // 브라우저 버그 방지용 초기화 후 시작
            try {
                recognition.start();
                isListening = true;
                document.getElementById('speech-btn').innerText = "🎧 핵심 요약 듣는 중...";
            } catch(e) {
                // 이미 돌아가고 있다면 강제로 멈췄다 다시 켤 수 있게 리셋
                recognition.stop();
            }
        }
    }

    window.onload = function() {
        var savedText = localStorage.getItem('mySecretMemo');
        if (savedText) {
            document.getElementById('memo-box').value = savedText;
        }
    }

    function savememo() {
        var boxValue = document.getElementById('memo-box').value;
        localStorage.setItem('mySecretMemo', boxValue);
    }

    function openmemo() {
        document.getElementById('title').style.display = 'none';
        document.getElementById('memo-btn').style.display = 'none';
        document.getElementById('memo-box').style.display = 'block';
        document.getElementById('back-btn').style.display = 'block';
        document.getElementById('speech-btn').style.display = 'block'; 
    }

    function closememo() {
        document.getElementById('title').style.display = 'block';   
        document.getElementById('memo-btn').style.display = 'block';     
        document.getElementById('memo-box').style.display = 'none';      
        document.getElementById('back-btn').style.display = 'none';  
        document.getElementById('speech-btn').style.display = 'none'; 
        try { recognition.stop(); } catch(e) {} // 뒤로 갈 때 마이크 켜져있으면 끄기
    }
    </script>
</HTML>
