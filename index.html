<!DOCTYPE HTML>
<HTML>
<HEAD>
    <TITLE>개인용ai 노트</TITLE>
    <style>
        /* 🖤 전체 기본 화면 세팅 */
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        /* 🌈 메인 화면용 정중앙 정렬 방 */
        .main-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 56px;
            background: linear-gradient(to right, #4285f4, #9b51e0, #ea4335, #fbbc05, #4285f4);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-flow 2s linear infinite;
        }

        @keyframes rainbow-flow {
            0% { background-position: 0% center; }
            100% { background-position: -200% center; }
        }
        
        button {
            padding: 10px 20px;
            background-color: #2997ff;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        /* 🗺️ 좌/우 분할 레이아웃 컨트롤러 */
        .memo-layout-workspace {
            display: none;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
        }

        /* 👈 [사이드바 구역] */
        .left-sidebar {
            width: 80px;
            height: 100vh;
            padding: 20px 0 0 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
            float: left;
            align-items: center;
        }

        /* 🔙 뒤로가기 버튼 */
        #back-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            background-color: #1c1c1e;
            color: #2997ff;
            font-size: 16px;
            border: 1px solid #2997ff;
            border-radius: 8px;
            cursor: pointer;
        }
        #back-btn:hover {
            background-color: #2997ff;
            color: #ffffff;
        }

        /* 🎙️ 음성 인식 버튼 */
        #speech-btn {
            width: 50px;
            height: 40px;
            padding: 0;
            font-size: 14px;
            background-color: #0a192f;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15);
        }
        #speech-btn:hover {
            background-color: #38bdf8;
            color: #000000;
        }

        /* 🔊 스피커 토글 버튼 */
        #speak-btn {
            width: 50px;
            height: 40px;
            padding: 0;
            font-size: 14px;
            background-color: #0a192f;
            color: #a855f7;
            border: 1px solid #a855f7;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.15);
            cursor: pointer;
        }

        /* 🎵 구글 검색 스타일의 말할 때 춤추는 점 4개 컨테이너 */
        .google-dots-container {
            display: none;
            gap: 4px;
            justify-content: center;
            align-items: center;
            height: 30px;
            width: 50px;
            margin-top: 5px;
        }
        .google-dots-container.active {
            display: flex;
        }

        /* 동글동글한 점 설정 */
        .google-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            transition: transform 0.05s ease-out;
        }
        .google-dot:nth-child(1) { background-color: #4285f4; }
        .google-dot:nth-child(2) { background-color: #ea4335; }
        .google-dot:nth-child(3) { background-color: #fbbc05; }
        .google-dot:nth-child(4) { background-color: #34a853; }
                /* 👉 [메모장 구역] */
        .right-content {
            margin-left: 80px;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        textarea {
            width: 100%;
            height: calc(100vh - 40px);
            background-color: #1c1c1e;
            color: #ffffff;
            font-size: 18px;
            padding: 25px;
            border: 2px solid #2997ff;
            border-radius: 16px;
            outline: none;
            resize: none;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }
    </style>
</HEAD>
<BODY>
    <!-- 1층 무대: 초기 정중앙 화면 -->
    <div id="main-view" class="main-container">
        <h1>안녕하세요</h1>
        <button id="memo-btn" onclick="openmemo()">메모창 열기</button>
    </div>

    <!-- 2층 무대: 메모장 전용 분할 작업 공간 -->
    <div id="workspace-view" class="memo-layout-workspace">
        <div class="left-sidebar">
            <button id="back-btn" onclick="closememo()">◀</button>
            <button id="speech-btn" onclick="startSpeech()">🎙️</button>
            <button id="speak-btn" onclick="toggleAudioSwitch()">🔊 켜짐</button>
            
            <!-- 🎵 🔊 버튼 밑에 고정 배치된 점 4개 구조 -->
            <div id="google-dots" class="google-dots-container">
                <div class="google-dot"></div>
                <div class="google-dot"></div>
                <div class="google-dot"></div>
                <div class="google-dot"></div>
            </div>
        </div>
        <div class="right-content">
            <textarea id="memo-box" oninput="savememo()"></textarea>
        </div>
    </div>
        <script>
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        var recognition = new SpeechRecognition();
        recognition.lang = 'ko-KR';
        
        // 🎯 [속도 가속] 문장이 완전히 끝날 때까지 기다리지 않고 실시간 단어 가로채기 모드 활성화
        recognition.interimResults = true; 
        recognition.maxAlternatives = 1;
        recognition.continuous = true; 

        var isListening = false;
        var isAudioOn = true;
        var isWaitingForWakeWord = true; 

        // 🎙️ 오디오 분석 장치 전용 보관소
        var audioContext;
        var analyser;
        var micStream;
        var lastHeights = new Array(0, 0, 0, 0); 

        recognition.onresult = function(event) {
            var currentResultIndex = event.resultIndex;
            
            // 🎯 [버그 영구 박멸] [0] 방 번호 주소를 정확하게 명시하여 trim 에러 완벽 해결!
            var speechResult = event.results[currentResultIndex][0].transcript.trim();
            var memoBox = document.getElementById('memo-box');

            // 1️⃣ 자비스 호출어 대기 상태일 때 (실시간 단어 가로채기로 즉시 응답)
            if (isWaitingForWakeWord) {
                if (speechResult.includes("자비스") || speechResult.includes("비스")) {
                    isWaitingForWakeWord = false; // 빛의 속도로 받아쓰기 잠금 해제
                    
                    document.getElementById('google-dots').classList.add('active');
                    startMicAnalysis();
                    
                    // 다정한 안내 멘트 출력
                    if (isAudioOn) {
                        window.speechSynthesis.cancel();
                        var utterance = new SpeechSynthesisUtterance("무엇을 도와드릴까요?");
                        utterance.lang = 'ko-KR';
                        window.speechSynthesis.speak(utterance);
                    }
                }
            } 
            // 2️⃣ 자비스가 깨어나서 메모를 받아적는 상태일 때
            else {
                // 사용자가 말을 전부 끝마치고 문장이 '최종 확정(isFinal)'될 때까지 얌전히 기다렸다가 받아적습니다.
                if (event.results[currentResultIndex].isFinal) {
                    // 🎯 [명확한 도려내기] 메모 본문 요약에서 자비스라는 이름을 깨끗하게 필터링합니다.
                    var summarizedText = speechResult
                        .replace(/자비스|비스/g, "")
                        .replace(/말이야|했거든|진짜로|그니까|진짜|약간/g, "")
                        .trim();
                    
                    if (summarizedText.length > 0) {
                        var fullNewText = "\n요약: " + summarizedText;
                        if (isAudioOn) {
                            window.speechSynthesis.cancel();
                            var utterance = new SpeechSynthesisUtterance(summarizedText);
                            utterance.lang = 'ko-KR';
                            utterance.rate = 1.1;
                            window.speechSynthesis.speak(utterance);
                        }
                        
                        var charIndex = 0;
                        function typeWriter() {
                            if (charIndex < fullNewText.length) {
                                memoBox.value += fullNewText.charAt(charIndex);
                                charIndex++;
                                savememo();
                                setTimeout(typeWriter, 50);
                            } else {
                                // 한 문장 작성이 완벽하게 끝나면 다시 자비스 호출 대기 상태로 루프 복귀
                                isWaitingForWakeWord = true;
                                document.getElementById('google-dots').classList.remove('active');
                                stopMicAnalysis();
                            }
                        }
                        typeWriter();
                    }
                }
            }
        };

        // 브라우저 마이크 자동 부활 시스템
        recognition.onend = function() {
            if (isListening) {
                try { recognition.start(); } catch(e) {}
            } else {
                document.getElementById('speech-btn').innerText = "🎙️";
                document.getElementById('speech-btn').style.backgroundColor = "#0a192f";
                document.getElementById('google-dots').classList.remove('active');
                stopMicAnalysis();
            }
        };

        function startSpeech() {
            if (isListening) {
                isListening = false;
                recognition.stop();
            } else {
                try {
                    window.speechSynthesis.cancel();
                    recognition.start();
                    isListening = true;
                    isWaitingForWakeWord = true; 
                    document.getElementById('speech-btn').innerText = "🎧";
                    document.getElementById('speech-btn').style.backgroundColor = "#ea4335";
                } catch(e) {
                    recognition.stop();
                }
            }
        }

        // 📊 앙증맞은 엇박자 파동 가동 엔진
        function startMicAnalysis() {
            if (audioContext) return; 
            navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
                micStream = stream;
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                var source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                analyser.fftSize = 64; 
                analyser.smoothingTimeConstant = 0.8; 

                var bufferLength = analyser.frequencyBinCount;
                var dataArray = new Uint8Array(bufferLength);
                var dots = document.querySelectorAll('.google-dot');

                function drawVolume() {
                    if (isWaitingForWakeWord || !isListening) return; 
                    analyser.getByteFrequencyData(dataArray);

                    var targetIndices = new Array(1, 4, 8, 12); 

                    dots.forEach(function(dot, index) {
                        var rawValue = dataArray[targetIndices[index]];
                        var targetHeight = (rawValue > 35) ? (rawValue / 45.0) : 0;
                        if (targetHeight > 4) targetHeight = 3.5; 
                        
                        var smoothHeight = lastHeights[index] + (targetHeight - lastHeights[index]) * 0.25;
                        lastHeights[index] = smoothHeight;

                        dot.style.transform = `translateY(-${smoothHeight}px)`;
                    });

                    requestAnimationFrame(drawVolume);
                }
                drawVolume();
            }).catch(function(err) {
                console.log("마이크 접근 실패:", err);
            });
        }

        function stopMicAnalysis() {
            if (micStream) { micStream.getTracks().forEach(track => track.stop()); micStream = null; }
            if (audioContext) { audioContext.close(); audioContext = null; }
            lastHeights = new Array(0, 0, 0, 0);
            document.querySelectorAll('.google-dot').forEach(dot => dot.style.transform = 'translateY(0)');
        }

        function toggleAudioSwitch() {
            var speakBtn = document.getElementById('speak-btn');
            if (isAudioOn) {
                isAudioOn = false;
                window.speechSynthesis.cancel();
                speakBtn.innerText = "🔇 꺼짐";
                speakBtn.style.color = "#86868b";
                speakBtn.style.border = "1px solid #86868b";
                speakBtn.style.boxShadow = "none";
            } else {
                isAudioOn = true;
                speakBtn.innerText = "🔊 켜짐";
                speakBtn.style.color = "#a855f7";
                speakBtn.style.border = "1px solid #a855f7";
                speakBtn.style.boxShadow = "0 4px 15px rgba(168, 85, 247, 0.15)";
            }
        }

        window.onload = function() {
            var savedText = localStorage.getItem('mySecretMemo');
            if (savedText) { document.getElementById('memo-box').value = savedText; }
            startSpeech(); 
        }

        function savememo() {
            var boxValue = document.getElementById('memo-box').value;
            localStorage.setItem('mySecretMemo', boxValue);
        }

        function openmemo() {
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('workspace-view').style.display = 'block';
        }

        function closememo() {
            window.speechSynthesis.cancel();
            document.getElementById('workspace-view').style.display = 'none';
            document.getElementById('main-view').style.display = 'flex';
            isListening = false;
            recognition.stop();
        }
    </script>
</BODY>
</HTML>
