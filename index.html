<!DOCTYPE HTML>
<HTML>
    <HEAD>
        <TITLE>개인용ai 노트</TITLE>
         <style>
       
        body {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            flex-direction: column;
        }

       
        h1 {
            font-size: 56px; 
            background: linear-gradient(to right, #4285f4, #9b51e0, #ea4335, #fbbc05, #4285f4);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-flow 2s linear infinite;
        }

        @keyframes rainbow-flow {
            0% { background-position: 0% center; }
            100% { background-position: -200% center; }
        }
        
       
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2997ff;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

      
        #back-btn {
            position: fixed;            
            top: 20px;
            left: 20px;
            margin-top: 0;
            width: 40px;               
            height: 40px;
            padding: 0;
            background-color: #1c1c1e; 
            color: #2997ff;            
            font-size: 16px;
            border: 1px solid #2997ff; 
            border-radius: 8px;         
            cursor: pointer;
        }
        #back-btn:hover {
            background-color: #2997ff;
            color: #ffffff;
        }

       
        textarea {
            margin-top: 30px;
            width: 100%;
            max-width: 450px;
            height: 250px;
            background-color: #1c1c1e;
            color: #ffffff;
            font-size: 18px;
            padding: 20px;
            border: 2px solid #2997ff;
            border-radius: 16px;
            outline: none;
            resize: none;
        }
    </style>
    </HEAD>
<body>
  
    <h1 id="title">안녕하세요</h1>
    <button id="memo-btn" onclick="openmemo()">메모창 열기</button>
    <textarea id="memo-box" style="display: none;"></textarea>        
    <button id="back-btn" onclick="closememo()" style="display: none;">◀</button>
</body>

   
    <script>
    function openmemo() {
        var title = document.getElementById('title');
        var btn = document.getElementById('memo-btn');
        var box = document.getElementById('memo-box');
        var backBtn = document.getElementById('back-btn');
        
        title.style.display = 'none';
        btn.style.display = 'none';
        
        box.style.display = 'block';
        backBtn.style.display = 'block'; 
    }

    function closememo() {
        var title = document.getElementById('title');
        var btn = document.getElementById('memo-btn');
        var box = document.getElementById('memo-box');
        var backBtn = document.getElementById('back-btn');
        
        title.style.display = 'block';   
        btn.style.display = 'block';    
        
        box.style.display = 'none';     
        backBtn.style.display = 'none'; 
    }
    </script>
</HTML>
